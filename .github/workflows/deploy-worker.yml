name: Deploy Worker

# Standard Freedom Times web Worker deploy path (web/docs/DEPLOY.md):
#   - pull_request to main from a cultpodcasts branch (not a fork) -> staging Worker
#     (same steps as `pwsh ./scripts/deploy-staging-local.ps1 -WorkerOnly -SkipVersionBump`,
#     with the pre-migrate staging backup taken as a Turso branch).
#   - push/merge to main -> verified production Turso backup branch `prod-rollback-YYYYMMDD-HHMMSS`
#     in its own step, THEN the production Worker deploy (same steps as
#     `deploy-production-local.ps1 -WorkerOnly -AllowProduction`). The deploy step only runs if the
#     backup step passed, and refuses to migrate if its target host is not the backed-up host.
#     It also fails closed (#142) unless the LIVE production Worker's DB host hash
#     (/api/deploy-provenance.json) matches the backed-up host, before migrate and again
#     against the new version after deploy. Bootstrap: a pre-deploy 404 is a loud ::warning::
#     falling back to the secret-vs-backup check ONLY when the live Worker's commit
#     (/api/version.json) is in history and predates the endpoint (#144: first run after the
#     endpoint ships, or after a rollback past it); otherwise it fails closed.
# This repo is public: backups are never public (web/docs/DEPLOY.md § Backups are never public).
# CI never exports, uploads, caches or prints a database file, dump or row data;
# scripts/ci-check-no-public-backups.mjs enforces the workflow side.
# Secrets are scoped to the steps that use them; installs and npm ci run with none.
# No Terraform apply here: Terraform stays plan-only in terraform-*.yml (holding_page guard there).
# The local deploy scripts stay as the fallback.

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/deploy-worker.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"
  TERRAFORM_VERSION: "1.14.8"

jobs:
  staging:
    name: Deploy Worker to Staging
    # Forks get no secrets and must never deploy. Dependabot PRs get no secrets either.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.freedomtimes.news
    concurrency:
      # Shared only with mutating (dispatch) terraform-staging.yml runs, so EmDash migrate never
      # races. A running deploy is never cancelled. GitHub keeps one PENDING run per group: a
      # newer push replaces an older pending one (the most recent push owns staging). A run shown
      # as cancelled while pending was superseded; re-run it if its commit still needs staging.
      group: staging-emdash-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: No-secrets guards (backups never public; deploy guard tests)
        # Before any secret-bearing step. Same checks as ci-guards.yml, repeated here so a
        # deploy never starts from a tree that fails them.
        shell: pwsh
        run: |
          node ./scripts/ci-check-no-public-backups.mjs
          if ($LASTEXITCODE -ne 0) { throw "Backup-exposure guard failed." }
          pwsh -NoProfile -File ./scripts/test-deploy-cloud-agent-guards.ps1
          if ($LASTEXITCODE -ne 0) { throw "Deploy guard tests failed." }

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Setup Terraform (outputs only; no plan/apply)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (staging, for turso_database_url / auth_token outputs)
        working-directory: infra/terraform/environments/staging
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: terraform init -input=false

      - name: Install pinned Turso CLI (sha256-verified, no secrets)
        run: bash ./scripts/ci-install-turso-cli.sh

      - name: Deploy staging Worker (backup branch, build, migrate, deploy, verify)
        shell: pwsh
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          TF_VAR_CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
          # Turso platform API token (turso CLI auth for the staging backup branch); same secret terraform-staging.yml uses.
          TURSO_API_TOKEN: ${{ secrets.TURSO_TOKEN_STAGING }}
          TF_VAR_TURSO_ORGANIZATION: ${{ vars.TF_VAR_TURSO_ORGANIZATION }}
          TF_VAR_TURSO_DATABASE_GROUP_STAGING: ${{ vars.TF_VAR_TURSO_DATABASE_GROUP_STAGING }}
          TF_VAR_WORKER_NAME_STAGING: ${{ vars.TF_VAR_WORKER_NAME_STAGING }}
          PUSH_STAGING_SUBSCRIBE_PUBLIC_KEY: ${{ secrets.PUSH_STAGING_SUBSCRIBE_PUBLIC_KEY }}
          PUSH_STAGING_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_STAGING_VAPID_PRIVATE_KEY }}
          PUSH_STAGING_VAPID_SUBJECT: ${{ secrets.PUSH_STAGING_VAPID_SUBJECT }}
          PUSH_STAGING_ANDROID_FCM_PROJECT_ID: ${{ secrets.PUSH_STAGING_ANDROID_FCM_PROJECT_ID }}
          PUSH_STAGING_ANDROID_FCM_CLIENT_EMAIL: ${{ secrets.PUSH_STAGING_ANDROID_FCM_CLIENT_EMAIL }}
          PUSH_STAGING_ANDROID_FCM_PRIVATE_KEY: ${{ secrets.PUSH_STAGING_ANDROID_FCM_PRIVATE_KEY }}
        run: ./scripts/deploy-staging-local.ps1 -WorkerOnly -SkipVersionBump -TursoBranchBackup

      - name: Record staging Worker deployments
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Author: lines carry the Cloudflare account email; keep them out of this public summary.
          {
            echo "### Staging Worker deployments"
            echo '```'
            npx --prefix web wrangler deployments list --config web/wrangler.jsonc --env staging 2>&1 | grep -v -i '^[[:space:]]*Author:' | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Backup + Deploy Worker to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://freedomtimes.news
    concurrency:
      # Shared only with mutating (dispatch) terraform-production.yml runs, so EmDash migrate never
      # races. A running deploy is never cancelled. A newer merge replaces an older PENDING run
      # (the newest main is deployed); re-run a superseded run only if its commit must ship alone.
      group: production-emdash-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history: a pre-deploy provenance 404 is a bootstrap only if the live
          # Worker's commit (/api/version.json) is in history and predates the endpoint (#144).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: No-secrets guards (backups never public; deploy guard tests)
        # Before any secret-bearing step. Same checks as ci-guards.yml, repeated here so a
        # deploy never starts from a tree that fails them.
        shell: pwsh
        run: |
          node ./scripts/ci-check-no-public-backups.mjs
          if ($LASTEXITCODE -ne 0) { throw "Backup-exposure guard failed." }
          pwsh -NoProfile -File ./scripts/test-deploy-cloud-agent-guards.ps1
          if ($LASTEXITCODE -ne 0) { throw "Deploy guard tests failed." }

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install pinned Turso CLI (sha256-verified, no secrets)
        run: bash ./scripts/ci-install-turso-cli.sh

      - name: Verified production EmDash backup (Turso branch prod-rollback-YYYYMMDD-HHMMSS; no .db)
        shell: pwsh
        env:
          # Turso platform API token (turso CLI auth for the prod-rollback branch); same secret terraform-production.yml uses.
          TURSO_API_TOKEN: ${{ secrets.TURSO_TOKEN }}
          TF_VAR_TURSO_ORGANIZATION: ${{ vars.TF_VAR_TURSO_ORGANIZATION }}
          TF_VAR_TURSO_DATABASE_GROUP_PRODUCTION: ${{ vars.TF_VAR_TURSO_DATABASE_GROUP_PRODUCTION }}
          TF_VAR_TURSO_DATABASE_NAME_PRODUCTION: ${{ vars.TF_VAR_TURSO_DATABASE_NAME_PRODUCTION }}
          # The DB the backup reads. The deploy step migrates the URL from the same secret and
          # refuses to run if its host differs from the backed-up workerTursoHost.
          TURSO_PRODUCTION_EMDASH_DB_URL: ${{ secrets.TURSO_PRODUCTION_EMDASH_DB_URL }}
          TURSO_PRODUCTION_EMDASH_DB_TOKEN: ${{ secrets.TURSO_PRODUCTION_EMDASH_DB_TOKEN }}
          # #148: the backup script proves that host is the live Worker's DB (/api/deploy-provenance.json)
          # before creating any branch. Optional bearer, only if the Worker has that secret.
          DEPLOY_PROVENANCE_TOKEN: ${{ secrets.DEPLOY_PROVENANCE_TOKEN }}
        run: |
          $group = if ([string]::IsNullOrWhiteSpace($env:TF_VAR_TURSO_DATABASE_GROUP_PRODUCTION)) { "freedomtimes-production" } else { $env:TF_VAR_TURSO_DATABASE_GROUP_PRODUCTION }
          # -SkipFileExport: verify reads the new branch directly; nothing is written to disk.
          # -SkipAgentsLog: the backup log commit in freedomtimes-agents is a manual follow-up.
          ./scripts/backup-production-emdash.ps1 -AllowProduction -TursoGroup $group -SkipStagingCompare -UseNativeTurso `
            -SkipFileExport -SkipAgentsLog `
            -Notes "deploy-worker.yml run ${{ github.run_id }} (${{ github.sha }}) Worker-resolved EmDash backup"
          if ($LASTEXITCODE -ne 0) { throw "Production EmDash backup/verify failed (exit $LASTEXITCODE). Nothing deployed." }
          $meta = Get-ChildItem .release/rollback-branches/*-prod-rollback-*.json | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $meta) { throw "Backup step left no prod-rollback metadata. Nothing deployed." }
          $m = Get-Content -Raw -LiteralPath $meta.FullName | ConvertFrom-Json
          if ($m.verificationPass -ne $true) { throw "Backup $($m.backupDatabase) is not verified. Nothing deployed." }
          $live = if ($m.PSObject.Properties["liveProvenanceCheck"]) { [string]$m.liveProvenanceCheck } else { "" }
          if ($live -ne "match" -and $m.resolveSource -ne "wrangler-getPlatformProxy-production") {
            # Only when the backup script could not prove the source (bootstrap). On a match it
            # already wrote one ::notice:: (#148). The deploy step's provenance check (#142) still runs.
            Write-Host "::notice::Backup source came from env fallback $($m.resolveSource) (the TURSO_PRODUCTION_EMDASH_DB_URL secret) and was not proven live before backup ($live). The deploy step checks the live Worker's DB host hash against this backup before migrating (#142)."
          }
          $sourceProof = if ($live -eq "match") { "verified by live Worker provenance before backup (#148)" } else { "NOT verified before backup ($live)" }
          @(
            "### Production EmDash backup",
            "- Turso branch: ``$($m.backupDatabase)`` (verified; no .db exported or uploaded)",
            "- Source: ``$($m.sourceDatabase)`` via $($m.resolveSource), $sourceProof",
            "- Restore: web/docs/DEPLOY.md § If the production job fails"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Deploy production Worker (build, migrate, deploy, verify)
        # Runs only when the backup step above passed (default success() gate).
        shell: pwsh
        env:
          TF_VAR_CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_TURSO_ORGANIZATION: ${{ vars.TF_VAR_TURSO_ORGANIZATION }}
          TF_VAR_TURSO_DATABASE_GROUP_PRODUCTION: ${{ vars.TF_VAR_TURSO_DATABASE_GROUP_PRODUCTION }}
          TF_VAR_TURSO_DATABASE_NAME_PRODUCTION: ${{ vars.TF_VAR_TURSO_DATABASE_NAME_PRODUCTION }}
          TF_VAR_WORKER_NAME_PRODUCTION: ${{ vars.TF_VAR_WORKER_NAME_PRODUCTION }}
          # Build-time EmDash migrate credentials (runtime uses the Worker's own TURSO_* secrets).
          TURSO_PRODUCTION_EMDASH_DB_URL: ${{ secrets.TURSO_PRODUCTION_EMDASH_DB_URL }}
          TURSO_PRODUCTION_EMDASH_DB_TOKEN: ${{ secrets.TURSO_PRODUCTION_EMDASH_DB_TOKEN }}
          # Optional bearer for /api/deploy-provenance.json (#142). Empty = endpoint is open
          # (it only ever returns a hash of the Worker's Turso host, never the host or a token).
          DEPLOY_PROVENANCE_TOKEN: ${{ secrets.DEPLOY_PROVENANCE_TOKEN }}
          PUSH_PRODUCTION_SUBSCRIBE_PUBLIC_KEY: ${{ secrets.PUSH_PRODUCTION_SUBSCRIBE_PUBLIC_KEY }}
          PUSH_PRODUCTION_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_PRODUCTION_VAPID_PRIVATE_KEY }}
          PUSH_PRODUCTION_VAPID_SUBJECT: ${{ secrets.PUSH_PRODUCTION_VAPID_SUBJECT }}
          PUSH_PRODUCTION_ANDROID_FCM_PROJECT_ID: ${{ secrets.PUSH_PRODUCTION_ANDROID_FCM_PROJECT_ID }}
          PUSH_PRODUCTION_ANDROID_FCM_CLIENT_EMAIL: ${{ secrets.PUSH_PRODUCTION_ANDROID_FCM_CLIENT_EMAIL }}
          PUSH_PRODUCTION_ANDROID_FCM_PRIVATE_KEY: ${{ secrets.PUSH_PRODUCTION_ANDROID_FCM_PRIVATE_KEY }}
        run: ./scripts/deploy-production-local.ps1 -WorkerOnly -AllowProduction -UseFreshTursoCheckpoint

      - name: Record production Worker deployments
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Author: lines carry the Cloudflare account email; keep them out of this public summary.
          # The version ids listed here are the `wrangler rollback` targets (web/docs/DEPLOY.md).
          {
            echo "### Production Worker deployments"
            echo '```'
            npx --prefix web wrangler deployments list --config web/wrangler.jsonc --env production 2>&1 | grep -v -i '^[[:space:]]*Author:' | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
